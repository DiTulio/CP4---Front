<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre em contato com a EcoTrend.">
    <title>Contato - EcoTrend</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar-eco">
        <nav class="container menu-eco" aria-label="Menu principal">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-leaf" aria-hidden="true"></i> EcoTrend</a>
            <ul class="menu-links">
                <li><a href="index.html">Início</a></li>
                <li><a href="categoria.html">Categorias</a></li>
                <li><a href="produto.html">Produtos</a></li>
                <li><a href="contato.html" aria-current="page">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-5">
        <header>
            <h1>Fale com a gente</h1>
            <p>Envie sua mensagem para a equipe EcoTrend.</p>
        </header>

        <div class="row g-4">
            <section class="col-md-7" aria-labelledby="titulo-formulario">
                <h2 id="titulo-formulario">Formulário de contato</h2>
                <form action="#" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="nome">Nome</label>
                        <input class="form-control" id="nome" name="nome" type="text" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="email">E-mail</label>
                        <input class="form-control" id="email" name="email" type="email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="mensagem">Mensagem</label>
                        <textarea class="form-control" id="mensagem" name="mensagem" rows="5" required></textarea>
                    </div>

                    <button class="btn btn-eco" type="submit">Enviar mensagem</button>
                </form>
            </section>

            <aside class="col-md-5" aria-labelledby="titulo-contato">
                <h2 id="titulo-contato">Informações de contato</h2>
                <address>
                    <p><i class="fa-solid fa-location-dot" aria-hidden="true"></i> São Paulo, SP</p>
                    <p><i class="fa-solid fa-phone" aria-hidden="true"></i> <a href="tel:+551140028922">(11) 4002-8922</a></p>
                    <p><i class="fa-solid fa-envelope" aria-hidden="true"></i> <a href="mailto:contato@ecotrend.com.br">contato@ecotrend.com.br</a></p>
                </address>
            </aside>
        </div>
    </main>

    <footer class="footer-eco text-center">
        <div class="container"><p class="mb-0">&copy; 2026 EcoTrend</p></div>
    </footer>
</body>
</html>
